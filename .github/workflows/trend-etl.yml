name: GitHub Trend Engine ETL

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual run from GitHub UI

concurrency:
  group: trend-engine-etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/migrate.ts

      - name: Execute Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: npx tsx scripts/run-trend-etl.ts

      - name: Export compare pairs
        run: npx tsx scripts/export-compare-pairs.ts

      - name: Setup Python (Laya verdicts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Laya model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-hf-${{ runner.os }}-v1

      - name: Install Laya (CPU)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install laya==0.3.20

      - name: Compute Laya quick-take verdicts
        # Soft-fail by design: compare pages work fully without verdicts.
        continue-on-error: true
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python scripts/laya-verdicts.py

      - name: Commit Updated Static Dataset (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/trending-summary.json public/data/archive/
          if [ -f public/data/laya-verdicts.json ]; then git add public/data/laya-verdicts.json; fi
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-update trending dataset + archive snapshot [skip ci]"
            git pull --rebase origin "$BRANCH_NAME" || true
            git push origin HEAD:"$BRANCH_NAME" || echo "Push skipped or branch protected"
          fi
